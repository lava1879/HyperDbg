<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1f2328; }
    .box { fill: #eaeef2; stroke: #57606a; stroke-width: 2; }
    .line { stroke: #57606a; stroke-width: 3; }
    .hint { stroke: #8c959f; stroke-width: 1; stroke-dasharray: 3 3; }
    .sub { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .box { fill: #21262d; stroke: #8b949e; }
      .line { stroke: #8b949e; }
      .hint { stroke: #6e7681; }
      .sub { fill: #8b949e; }
    }
  </style>
  <rect class="box" x="20" y="30" width="190" height="90" rx="10"/>
  <text x="115" y="70" text-anchor="middle" font-size="18" font-weight="bold">Debugger</text>
  <text class="sub" x="115" y="96" text-anchor="middle" font-size="13">.debug remote usb</text>
  <rect class="box" x="430" y="30" width="190" height="90" rx="10"/>
  <text x="525" y="70" text-anchor="middle" font-size="18" font-weight="bold">Debuggee</text>
  <text class="sub" x="525" y="96" text-anchor="middle" font-size="13">.debug prepare usb</text>
  <line class="line" x1="210" y1="75" x2="430" y2="75"/>
  <text x="320" y="62" text-anchor="middle" font-size="14">USB 3 cable</text>
  <line class="hint" x1="250" y1="140" x2="228" y2="85"/>
  <line class="hint" x1="390" y1="140" x2="412" y2="85"/>
  <text class="sub" x="250" y="158" text-anchor="middle" font-size="12">WinUSB</text>
  <text class="sub" x="390" y="158" text-anchor="middle" font-size="12">xHCI DbC port</text>
</svg>
